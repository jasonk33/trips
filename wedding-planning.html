<script>
(async () => {
  const status = document.getElementById('status');
  const keyText = new URLSearchParams(location.hash.slice(1)).get('key');
  if (!keyText) return;
  const decode = value => Uint8Array.from(atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4)), char => char.charCodeAt(0));
  try {
    if (!/^[A-Za-z0-9_-]{43}$/.test(keyText)) throw new Error('Invalid share key.');
    if (!globalThis.crypto?.subtle) throw new Error('Secure browser decryption is unavailable.');
    const data = JSON.parse(document.getElementById('encrypted-report').textContent);
    if (data.version !== 1 || data.algorithm !== 'AES-GCM') throw new Error('Unsupported report format.');
    const key = await crypto.subtle.importKey('raw', decode(keyText), {name:'AES-GCM'}, false, ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(data.iv)},key,decode(data.ciphertext));
    const report = new TextDecoder('utf-8',{fatal:true}).decode(plaintext);
    if (!report.startsWith('<!doctype html>')) throw new Error('Invalid decrypted report.');
    const frame = document.getElementById('report');
    const anchors = '<script>document.addEventListener("click",event=>{const link=event.target.closest?.("a");const href=link?.getAttribute("href");if(!href?.startsWith("#"))return;const target=document.getElementById(decodeURIComponent(href.slice(1)));if(target){event.preventDefault();target.scrollIntoView({behavior:"smooth"});}});<'+'/script>';
    frame.srcdoc = report.replace('</body>',anchors+'</body>');
    frame.hidden = false;
    status.hidden = true;
    const copy = document.getElementById('copy-link');
    copy.hidden = false;
    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(location.origin + location.pathname + '#key=' + keyText);
        copy.textContent = 'Link copied';
      } catch (error) {
        console.error('Could not copy share link:',error);
        status.textContent = 'Copy the full address from your address bar, including everything after #.';
        status.hidden = false;
      }
    });
  } catch (error) {
    console.error('Report could not be unlocked:',error);
    status.textContent = 'This report could not be unlocked. Use the complete original share link, including its #key= portion.';
    status.hidden = false;
  }
})();
</script>
